[project]
name = "cartpilot"
version = "0.1.0"
description = "Multimodal AI shopping agent: receipts, pantry photos, purchase cadence and promotions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
    "pydantic>=2",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
# Application, not a library: uv does not build/install the project itself,
# it only manages the virtualenv and dependencies.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/*.py.mako"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (enforces list[str], X | None, ...)
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async (blocking calls inside async code)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a running PostgreSQL (docker compose up -d); skipped otherwise",
]
